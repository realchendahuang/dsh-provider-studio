name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: release gate (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # Windows proves the `eol=lf` promise in .gitattributes and the
          # byte-for-byte client.js rebuild on a non-POSIX filesystem.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The gate needs the repo's own devDependencies: esbuild (in-memory
      # rebuild of client.js) and yaml (cordis.patch.yml parsing).
      - name: Install dependencies
        run: npm ci

      - name: Release gate
        run: npm run check

      # Coverage runs the suite and fails on a coverage drop; `npm test` alone
      # would let the suite shrink silently.
      - name: Coverage
        run: npm run test:coverage
