version: 2

updates:
  # esbuild is the only npm dependency that changes the shipped artifact; the
  # runtime dependency ranges are pinned by the DSH contract instead.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # DSH-internal prerelease packages are aligned by hand with the DSH
      # runtime the plugin targets: Dependabot proposed 0.2.2-alpha.3, which is
      # older than the accepted 0.2.2-rc.1 and pulls a cordis peer that
      # conflicts with the root range (npm ci fails ERESOLVE).
      - dependency-name: "@deepseek-ai/dsh-typert-protocol"

  # Actions tags are pinned deliberately (checkout/setup-node v7); let the
  # updater surface a new major instead of bumping silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
